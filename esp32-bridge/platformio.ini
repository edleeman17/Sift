; Sift ANCS bridge for a classic ESP32 (ESP32-WROOM-32 / DevKitC style board).
; See README.md for setup, flashing and cut-over.

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Bigger app slots (1.9 MB x2) so WiFi + NimBLE + TLS + OTA all fit.
board_build.partitions = min_spiffs.csv
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Over-the-air updates once the board is on the network:
;   SIFT_ANCS_OTA_PASSWORD=... pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.1.55
upload_flags = --auth=${sysenv.SIFT_ANCS_OTA_PASSWORD}
