# Builds both images on every push to master and pushes them to the
# private registry, then restarts the live Nomad jobs so they actually
# run what was just built (force_pull is set on both job specs - without
# that a restart would just be the same stale cached image).
#
# Single-arch (amd64) only, unlike garden's multi-arch build - unlike
# garden neither job floats to the cluster's arm64 nodes: sift-processor
# is hard-pinned to macmini (see its pinned_reason), and
# sift-sms-assistant just hasn't been scheduled onto one yet in practice.
clone:
  git:
    image: docker.io/woodpeckerci/plugin-git
    settings:
      # git.lan's cert is mkcert-issued - the clone step doesn't trust
      # that CA by default, same fix nomad-job-specs' own pipeline needed.
      skip_verify: true

steps:
  build-and-push:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker buildx build -t registry.lan/sift-processor:latest --push processor/
      - docker buildx build -t registry.lan/sift-sms-assistant:latest --push sms-assistant/
    when:
      branch: master
      event: push

  redeploy:
    image: hashicorp/nomad:2.0.5
    environment:
      NOMAD_ADDR: http://192.168.1.95:4646
    commands:
      - nomad job restart -yes -on-error=fail -reschedule sift-processor
      - nomad job restart -yes -on-error=fail -reschedule sift-sms-assistant
    when:
      branch: master
      event: push
